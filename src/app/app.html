@if (isAuthPage()) {
  <!-- Connexion / inscription : pleine page, sans chrome -->
  <router-outlet />
} @else if (isAccueilPage()) {
  <!-- L’accueil inclut son propre en-tête et pied de page partagés -->
  <router-outlet />
} @else if (!estConnecte()) {
  <!-- Visiteur : en-tête public et contenu pleine largeur -->
  <div class="visitor-layout">
    <app-public-header />
    <main class="visitor-main">
      <router-outlet />
    </main>
    <app-public-footer />
  </div>
} @else {
  <!-- Utilisateur connecté : barre supérieure + navigation thématique -->
  <div class="layout" [class.drawer-open]="layout.menuOuvert()">
    @if (layout.menuOuvert()) {
      <div class="drawer-overlay" (click)="layout.fermer()" aria-hidden="true"></div>
    }

    <app-sidebar />

    <div class="main">
      <app-topbar />
      <main class="content" id="contenu-principal">
        <router-outlet />
      </main>
    </div>
  </div>
}
