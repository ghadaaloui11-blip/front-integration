<div class="page">
  <h1 class="page-title">Créer un signalement</h1>
  <p class="page-sub">Décrivez le problème, joignez une photo et précisez l'emplacement.</p>

  <form class="card-box" (ngSubmit)="onSubmit()" enctype="multipart/form-data">
    <div class="field">
      <label for="description">Description <span class="req">*</span></label>
      <textarea
        id="description"
        name="description"
        rows="5"
        required
        placeholder="Ex. : dépôt d'ordures devant l'école primaire, odeur très forte."
        [(ngModel)]="description"
      ></textarea>
    </div>

    <div class="field">
      <label>Localisation <span class="opt">(optionnel)</span></label>
      <div class="gps-row">
        <button type="button" class="btn-ghost" (click)="obtenirGPS()">
          Utiliser ma position GPS
        </button>

        @if (latitude && longitude) {
          <span class="gps-badge">
            Lat {{ latitude }} · Lon {{ longitude }}
            <button
              type="button"
              class="gps-clear"
              (click)="retirerGPS()"
              title="Effacer la position"
            >
              ×
            </button>
          </span>
        } @else {
          <span class="gps-empty">Aucune position sélectionnée</span>
        }
      </div>
    </div>

    <div class="field">
      <label for="photo">Photo <span class="opt">(optionnel)</span></label>
      <input
        #photoInput
        id="photo"
        class="photo-input"
        type="file"
        accept="image/jpeg,image/png"
        (change)="onFileSelected($event)"
      />

      @if (photoPreview) {
        <div class="photo-preview">
          <img [src]="photoPreview" alt="Aperçu de la photo sélectionnée" />
          <button type="button" class="btn-link" (click)="retirerPhoto()">
            Retirer la photo
          </button>
        </div>
      }
    </div>

    <label class="check-row">
      <input type="checkbox" name="estAnonyme" [(ngModel)]="estAnonyme" />
      <span>
        <strong>Rester anonyme</strong>
        <small>Votre nom ne sera pas visible par l'association.</small>
      </span>
    </label>

    @if (erreur) {
      <div class="alert alert-error">{{ erreur }}</div>
    }
    @if (message) {
      <div class="alert alert-success">{{ message }}</div>
    }

    <button type="submit" class="btn-main" [disabled]="envoi">
      {{ envoi ? 'Envoi en cours…' : 'Envoyer le signalement' }}
    </button>
  </form>
</div>
