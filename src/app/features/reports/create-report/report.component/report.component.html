<div class="page">
  <h1 class="page-title">Créer un signalement</h1>
  <p class="page-sub">Décrivez le problème, joignez une photo et précisez l'emplacement.</p>

  <form class="card-box" (ngSubmit)="onSubmit()" enctype="multipart/form-data">

    <!-- Titre -->
    <div class="field">
      <label for="titre">Titre <span class="req">*</span></label>
      <input
        id="titre"
        type="text"
        name="titre"
        placeholder="Ex. : Dépôt sauvage de déchets rue de la Paix"
        [(ngModel)]="titre"
        maxlength="200"
      />
    </div>

    <!-- Catégorie -->
    <div class="field">
      <label for="categorie">Catégorie <span class="req">*</span></label>
      <select id="categorie" name="categorie" [(ngModel)]="categorie">
        @for (cat of categories; track cat) {
          <option [value]="cat">{{ cat }}</option>
        }
      </select>
    </div>

    <!-- Description -->
    <div class="field">
      <label for="description">Description <span class="req">*</span></label>
      <textarea
        id="description"
        name="description"
        rows="5"
        placeholder="Décrivez la situation avec le plus de détails possible."
        [(ngModel)]="description"
      ></textarea>
    </div>

    <!-- Localisation -->
    <div class="field">
      <label>Localisation <span class="opt">(optionnel)</span></label>
      <div class="gps-row">
        <button type="button" class="btn-ghost" (click)="obtenirGPS()">
          📍 Utiliser ma position GPS
        </button>

        @if (latitude && longitude) {
          <span class="gps-badge">
            Lat {{ latitude }} · Lon {{ longitude }}
            <button type="button" class="gps-clear" (click)="retirerGPS()" title="Effacer">×</button>
          </span>
        } @else {
          <span class="gps-empty">Aucune position sélectionnée</span>
        }
      </div>
    </div>

    <!-- Photo -->
    <div class="field">
      <label for="photo">Photo <span class="opt">(optionnel)</span></label>
      <input
        #photoInput
        id="photo"
        class="photo-input"
        type="file"
        accept="image/jpeg,image/png"
        (change)="onFileSelected($event)"
      />

      @if (photoPreview) {
        <div class="photo-preview">
          <img [src]="photoPreview" alt="Aperçu" />
          <button type="button" class="btn-link" (click)="retirerPhoto()">Retirer la photo</button>
        </div>
      }
    </div>

    <!-- Anonyme -->
    <label class="check-row">
      <input type="checkbox" name="estAnonyme" [(ngModel)]="estAnonyme" />
      <span>
        <strong>Rester anonyme</strong>
        <small>Votre nom ne sera pas visible par l'association.</small>
      </span>
    </label>

    @if (erreur) {
      <div class="alert alert-error">{{ erreur }}</div>
    }
    @if (message) {
      <div class="alert alert-success">{{ message }}</div>
    }

    <button type="submit" class="btn-main" [disabled]="envoi">
      {{ envoi ? 'Envoi en cours…' : 'Envoyer le signalement' }}
    </button>

  </form>
</div>
