<div class="auth-container">
  <h2>Connexion</h2>
  <form #loginForm="ngForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Email :</label>
      <input
        type="email"
        [(ngModel)]="email"
        name="email"
        required
        email
        autocomplete="username"
        #emailField="ngModel"
      />
      @if (emailField.invalid && emailField.touched) {
        <p class="error">Veuillez saisir une adresse email valide.</p>
      }
    </div>
    <div class="form-group">
      <label>Mot de passe :</label>
      <input
        type="password"
        [(ngModel)]="motDePasse"
        name="motDePasse"
        required
        autocomplete="new-password"
        #mdpField="ngModel"
      />
      @if (mdpField.invalid && mdpField.touched) {
        <p class="error">Le mot de passe est obligatoire.</p>
      }
    </div>
    <button type="submit" [disabled]="loginForm.invalid || envoi">
      {{ envoi ? 'Connexion...' : 'Se connecter' }}
    </button>
    <p class="error" *ngIf="erreur">{{ erreur }}</p>
  </form>

  <p class="signup-link">Pas encore de compte ? <a routerLink="/inscription">S'inscrire</a></p>
</div>
