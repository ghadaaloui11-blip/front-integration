<div class="nc">
  <button
    class="nc-bell"
    type="button"
    (click)="toggle()"
    [attr.aria-expanded]="ouvert"
    aria-haspopup="dialog"
    aria-controls="notifications-panel"
    aria-label="Notifications"
  >
    <i class="bi bi-bell" aria-hidden="true"></i>
    @if (service.nonLues() > 0) {
      <span class="nc-badge" [attr.aria-label]="service.nonLues() + ' notifications non lues'">
        {{ service.nonLues() }}
      </span>
    }
  </button>

  @if (ouvert) {
    <div
      class="nc-panel"
      id="notifications-panel"
      role="dialog"
      aria-label="Centre de notifications"
    >
      <div class="nc-head">
        <strong>Notifications</strong>
        <button class="nc-link" type="button" (click)="toutLire()">Tout marquer lu</button>
      </div>

      @if (liste.length === 0) {
        <p class="nc-empty">Aucune notification</p>
      }

      @for (n of liste; track n.id) {
        <button
          class="nc-item"
          type="button"
          [class.nc-nonlue]="!n.lue"
          (click)="lire(n)"
        >
          <span class="nc-titre">{{ n.titre }}</span>
          <span class="nc-msg">{{ n.message }}</span>
          <span class="nc-date">{{ n.date_creation | date: 'dd/MM/yyyy HH:mm' }}</span>
        </button>
      }
    </div>
  }
</div>
